services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    command: ["mongosh", "mongodb://mongo:27017/admin", "--eval", "try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }"]

  matching-service:
    build: ./matching-service
    ports:
      - "6000:6000"
    restart: unless-stopped

  notification-service:
    build: ./notification-service
    ports:
      - "7000:7000"
    environment:
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
      - NOTIFICATION_SERVICE_API_KEY=${LOCAL_NOTIFICATION_SERVICE_API_KEY:-local-notification-key-change-me}
    restart: unless-stopped

  server:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/skillswap?replicaSet=rs0
      - JWT_SECRET=${LOCAL_JWT_SECRET:-local-jwt-secret-change-me}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - PORT=5000
      - MATCHING_SERVICE_URL=http://matching-service:6000
      - NOTIFICATION_SERVICE_URL=http://notification-service:7000
      - NOTIFICATION_SERVICE_TIMEOUT_MS=30000
      - NOTIFICATION_SERVICE_API_KEY=${LOCAL_NOTIFICATION_SERVICE_API_KEY:-local-notification-key-change-me}
      - CLIENT_ORIGINS=http://localhost:8080
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      matching-service:
        condition: service_started
      notification-service:
        condition: service_started
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
        - VITE_API_URL=${VITE_API_URL:-http://localhost:5000/api}
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  mongo-data:
