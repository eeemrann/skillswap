services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  matching-service:
    build: ./matching-service
    ports:
      - "6000:6000"
    restart: unless-stopped

  notification-service:
    build: ./notification-service
    ports:
      - "7000:7000"
    environment:
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
      - SMTP_SECURE=${SMTP_SECURE:-starttls}
    restart: unless-stopped

  server:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/skillswap}
      - JWT_SECRET=${JWT_SECRET:-dev_jwt_secret_change_me}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - PORT=5000
      - MATCHING_SERVICE_URL=http://matching-service:6000
      - NOTIFICATION_SERVICE_URL=http://notification-service:7000
      - NOTIFICATION_SERVICE_TIMEOUT_MS=30000
    depends_on:
      - mongo
      - matching-service
      - notification-service
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        - VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
        - VITE_API_URL=${VITE_API_URL:-http://localhost:5000/api}
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  mongo-data:
