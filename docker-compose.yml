services:
  mongo:
    image: mongo:7
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-init:
    image: mongo:7
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    command: ["mongosh", "mongodb://mongo:27017/admin", "--eval", "try { rs.status() } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }"]

  matching-service:
    build: ./matching-service
    ports:
      - "6000:6000"
    restart: unless-stopped

  notification-service:
    build: ./notification-service
    ports:
      - "7000:7000"
    environment:
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_FROM=${EMAIL_FROM}
      - NOTIFICATION_SERVICE_API_KEY=${LOCAL_NOTIFICATION_SERVICE_API_KEY:-local-notification-key-change-me}
    restart: unless-stopped

  # Optional TURN relay for video sessions: docker compose --profile turn up
  turn:
    profiles: ["turn"]
    image: coturn/coturn:4.6
    network_mode: host
    command: ["-c", "/etc/coturn/turnserver.conf", "--static-auth-secret=${TURN_SECRET:-local-turn-secret-change-me}"]
    volumes:
      - ./infra/turnserver.conf:/etc/coturn/turnserver.conf:ro
    restart: unless-stopped

  server:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/skillswap?replicaSet=rs0
      - CLERK_PUBLISHABLE_KEY=${VITE_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - PORT=5000
      - APP_URL=http://localhost:8080
      - CLIENT_ORIGINS=http://localhost:8080
      - MATCHING_SERVICE_URL=http://matching-service:6000
      - NOTIFICATION_SERVICE_URL=http://notification-service:7000
      - NOTIFICATION_SERVICE_TIMEOUT_MS=30000
      - NOTIFICATION_SERVICE_API_KEY=${LOCAL_NOTIFICATION_SERVICE_API_KEY:-local-notification-key-change-me}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_CONNECT_WEBHOOK_SECRET=${STRIPE_CONNECT_WEBHOOK_SECRET:-}
      - SIGNUP_CREDITS=${SIGNUP_CREDITS:-5}
      - PAYOUT_CENTS_PER_CREDIT=${PAYOUT_CENTS_PER_CREDIT:-800}
      - MIN_PAYOUT_CENTS=${MIN_PAYOUT_CENTS:-2000}
      - PAYOUT_HOLD_DAYS=${PAYOUT_HOLD_DAYS:-3}
      - PAYOUT_AUTO_APPROVE_CENTS=${PAYOUT_AUTO_APPROVE_CENTS:-25000}
      - PAYOUT_REVIEW_FIRST=${PAYOUT_REVIEW_FIRST:-true}
      - STUN_URLS=${STUN_URLS:-stun:stun.l.google.com:19302}
      - TURN_URLS=${TURN_URLS:-}
      - TURN_SECRET=${TURN_SECRET:-local-turn-secret-change-me}
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      matching-service:
        condition: service_started
      notification-service:
        condition: service_started
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:5000/api}
        - VITE_CLERK_PUBLISHABLE_KEY=${VITE_CLERK_PUBLISHABLE_KEY}
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  mongo-data:
