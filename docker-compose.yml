version: '3.8'

services:
  matching-service:
    build: ./matching-service
    ports:
      - "6000:6000"
    restart: unless-stopped

  notification-service:
    build: ./notification-service
    ports:
      - "7000:7000"
    environment:
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - EMAIL_FROM=${EMAIL_FROM}
    restart: unless-stopped

  server:
    build: ./server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      - MATCHING_SERVICE_URL=http://matching-service:6000
      - NOTIFICATION_SERVICE_URL=http://notification-service:7000
    depends_on:
      - matching-service
      - notification-service
    restart: unless-stopped

  client:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped
