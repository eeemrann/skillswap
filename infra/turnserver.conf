# coturn relay for WebRTC members who cannot connect peer-to-peer (strict NAT / corporate firewalls).
# The shared secret must equal TURN_SECRET on the API, which mints short-lived credentials from it.
listening-port=3478
fingerprint
use-auth-secret
realm=skillswap
total-quota=200
no-multicast-peers
no-cli
# In production set external-ip=<public ip> and open UDP 3478 plus the relay range below.
min-port=49160
max-port=49200
